name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (GDScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "gdtoolkit==4.*"
      - run: gdlint addons/ tests/

  test:
    name: Tests (gdUnit4)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: MikeSchulze/gdUnit4-action@v1.0.2
        with:
          godot-version: "4.3"
          paths: |
            res://tests/
          timeout: 5
          report-name: test_report.xml
